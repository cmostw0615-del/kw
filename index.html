<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151a25">
  <title>葡萄酒英文默寫｜四大葡萄品種</title>
  <style>
    :root { color-scheme: dark; --bg:#10141c; --panel:#1b2230; --panel2:#222b3a; --line:#344053; --text:#f2f5fb; --muted:#a5b0c4; --gold:#e6be78; --white:#f5dba1; --red:#db8696; --ok:#83dbb6; --bad:#ffa2a8; }
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse 95% 55% at 50% -10%,#28334a 0%,transparent 70%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
    .wrap{width:min(740px,calc(100% - 30px));margin:0 auto;padding:42px 0 70px}
    .eyebrow{color:var(--gold);font-size:12px;font-weight:750;letter-spacing:.18em;text-transform:uppercase}
    h1{font-size:clamp(27px,5vw,40px);line-height:1.18;letter-spacing:-.035em;margin:12px 0 14px}
    .lead{color:var(--muted);font-size:15px;margin:0 0 26px;max-width:550px}
    .meta{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:26px}
    .pill{padding:7px 12px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:12px;background:#1a2130}
    .toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 0 18px}
    .toolbar h2{font-size:17px;margin:0}.sub{color:var(--muted);font-size:12px}
    .switch{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;user-select:none;cursor:pointer}
    .switch input{accent-color:var(--gold);width:17px;height:17px}
    #question-list{display:grid;gap:13px}
    .question{padding:21px 22px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(115deg,#202838,var(--panel));box-shadow:0 8px 30px rgba(0,0,0,.08)}
    .topline{display:flex;align-items:center;gap:9px;margin-bottom:10px}
    .number{color:var(--gold);font-size:12px;font-weight:750;letter-spacing:.06em}
    .wine-type{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:99px;padding:3px 9px;background:rgba(255,255,255,.06);color:var(--muted)}
    .dot{height:7px;width:7px;border-radius:100%;background:var(--white)}.dot.red{background:var(--red)}
    .question h3{margin:0 0 12px;font-size:21px;letter-spacing:.025em}
    .answer{width:100%;border:1px solid #485367;background:#121a27;color:var(--text);border-radius:10px;padding:13px 14px;font-size:17px;outline:none;font-family:inherit;transition:border-color .15s}
    .answer::placeholder{color:#79879b}.answer:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(230,190,120,.11)}
    .answer.correct{border-color:var(--ok)}.answer.incorrect{border-color:var(--bad)}
    .under{min-height:24px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
    .hint-btn{border:0;background:none;padding:3px 0;color:var(--gold);font:inherit;font-size:12px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
    .hint{color:var(--gold);font-size:12px;display:none}.hint.visible{display:inline}
    .feedback{display:none;margin-top:11px;padding:11px 12px;background:rgba(0,0,0,.17);border-radius:8px;font-size:13px;color:var(--muted)}
    .feedback.visible{display:block}.feedback b{font-weight:700;color:var(--text)}.feedback .pass{color:var(--ok)}.feedback .fail{color:var(--bad)}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:23px}
    button.primary,button.secondary{border-radius:11px;padding:13px 19px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;min-height:46px}
    button.primary{border:1px solid var(--gold);background:var(--gold);color:#1b1b1b;flex:1}
    button.primary:hover{background:#f4cd8d}
    button.secondary{border:1px solid #5a6474;background:transparent;color:var(--text)}
    button.secondary:hover{background:#263247}
    button:focus-visible{outline:3px solid #e6be78;outline-offset:3px}
    .result{display:none;margin-top:23px;border:1px solid var(--line);border-radius:16px;padding:24px;background:var(--panel)}
    .result.visible{display:block}.result .score{font-weight:800;font-size:38px;line-height:1.15;letter-spacing:-.03em;color:var(--gold);margin-top:8px}
    .result p{color:var(--muted);margin:9px 0 0}
    .study{margin-top:29px;padding:20px 22px;border-radius:16px;background:rgba(230,190,120,.07);border:1px solid rgba(230,190,120,.25)}
    .study h2{font-size:16px;margin:0 0 12px}.study dl{margin:0;display:grid;gap:9px}
    .study .pair{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:9px;border-bottom:1px solid rgba(230,190,120,.11)}.study .pair:last-child{border:0;padding:0}
    .study dt{font-size:13px;color:var(--muted)}.study dd{margin:0;color:#f7deb0;font-weight:700;letter-spacing:.045em;font-size:14px}
    footer{font-size:12px;color:#8290a5;text-align:center;margin-top:27px}
    @media(max-width:480px){.wrap{padding-top:29px}.question{padding:17px}.toolbar{align-items:flex-start}.question h3{font-size:19px}.actions button{flex:1 1 auto}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow">WINE · SPELLING PRACTICE</div>
  <h1>葡萄酒英文默寫</h1>
  <p class="lead">四種葡萄品種 · 中文出題，英文默寫。題目每次重新洗牌；大小寫不計，但字母與單字順序要正確。</p>
  <div class="meta"><span class="pill">4 題</span><span class="pill">每題 25 分</span><span class="pill">滿分 100</span><span class="pill" id="best">最佳成績：—</span></div>
  <div class="toolbar"><div><h2 id="quiz-heading">默寫測驗</h2><span class="sub" id="progress">已填寫 0 / 4 題</span></div><label class="switch"><input type="checkbox" id="hints-toggle">顯示拆字提示</label></div>
  <form id="quiz-form" autocomplete="off" novalidate>
    <div id="question-list"></div>
    <div class="actions"><button class="primary" type="submit" id="submit-btn">提交批改</button><button class="secondary" type="button" id="restart-btn">重新出題 ↻</button><button class="secondary" type="button" id="retry-btn" hidden>只練錯題</button></div>
  </form>
  <section id="result" class="result" aria-live="polite"><div class="eyebrow">RESULT</div><div class="score" id="score"></div><p id="result-note"></p></section>
  <section class="study" aria-label="背誦拆字法"><h2>🧠 默寫拆字法</h2><dl>
    <div class="pair"><dt>麗絲玲</dt><dd>Ri · es · ling</dd></div>
    <div class="pair"><dt>白蘇維翁</dt><dd>Sau · vig · non / Blanc</dd></div>
    <div class="pair"><dt>梅洛</dt><dd>Mer · lot</dd></div>
    <div class="pair"><dt>卡本內蘇維翁</dt><dd>Ca · ber · net / Sau · vig · non</dd></div>
  </dl></section>
  <footer>離線可使用 · 無須登入 · 答案只在提交後顯示</footer>
</main>
<script>
(() => {
  'use strict';
  const bank = [
    {id:'riesling',name:'麗絲玲',alt:'利絲林',type:'白',answer:'Riesling',chunks:'Ri · es · ling'},
    {id:'sauvignon-blanc',name:'白蘇維翁',alt:'白蘇維濃',type:'白',answer:'Sauvignon Blanc',chunks:'Sau · vig · non / Blanc'},
    {id:'merlot',name:'梅洛',alt:'',type:'紅',answer:'Merlot',chunks:'Mer · lot'},
    {id:'cabernet-sauvignon',name:'卡本內蘇維翁',alt:'簡稱蘇維翁',type:'紅',answer:'Cabernet Sauvignon',chunks:'Ca · ber · net / Sau · vig · non'}
  ];
  const $ = id => document.getElementById(id);
  const normalize = s => s.trim().replace(/\s+/g,' ').toLowerCase();
  const shuffle = a => {let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
  let current = [], checked=false, mistakes=[];
  function bestScore(){try{return localStorage.getItem('wine-spelling-best');}catch{return null;}}
  function saveBest(value){try{localStorage.setItem('wine-spelling-best',String(value));}catch{}}
  function updateBest(){const b=bestScore();$('best').textContent='最佳成績：'+(b===null?'—':b+' / 100');}
  function progress(){const filled=[...document.querySelectorAll('.answer')].filter(el=>el.value.trim()).length;$('progress').textContent=`已填寫 ${filled} / ${current.length} 題`;}
  function make(tag,className,textContent){const el=document.createElement(tag);if(className)el.className=className;if(textContent!==undefined)el.textContent=textContent;return el;}
  function newQuiz(items){
    current=shuffle(items); checked=false; mistakes=[];
    $('result').classList.remove('visible');$('retry-btn').hidden=true;$('submit-btn').disabled=false;
    $('quiz-heading').textContent=items.length===bank.length?'默寫測驗':'錯題再練';
    $('question-list').replaceChildren();
    current.forEach((q,i)=>{
      const panel=make('section','question');
      const top=make('div','topline');top.append(make('span','number',`QUESTION ${String(i+1).padStart(2,'0')}`));
      const type=make('span','wine-type');const dot=make('span','dot'+(q.type==='紅'?' red':''));type.append(dot,document.createTextNode(q.type+'葡萄'));top.append(type);panel.append(top);
      const heading=make('h3','',q.name+(q.alt?'（'+q.alt+'）':''));panel.append(heading);
      const input=make('input','answer');input.type='text';input.name=q.id;input.placeholder='輸入完整英文名稱…';input.autocapitalize='off';input.autocorrect='off';input.spellcheck=false;input.setAttribute('aria-label',q.name+'英文名稱');input.addEventListener('input',progress);panel.append(input);
      const under=make('div','under');const hintButton=make('button','hint-btn','拆字提示');hintButton.type='button';const hint=make('span','hint',q.chunks);hintButton.addEventListener('click',()=>{hint.classList.toggle('visible');hintButton.textContent=hint.classList.contains('visible')?'隱藏提示':'拆字提示';});under.append(hintButton,hint);panel.append(under);
      const feedback=make('div','feedback');feedback.setAttribute('aria-live','polite');panel.append(feedback);
      $('question-list').append(panel);
    });
    $('hints-toggle').checked=false;progress();
    const first=document.querySelector('.answer');if(first)first.focus({preventScroll:true});
  }
  function checkAnswers(){
    if(checked)return;
    checked=true;let correct=0;mistakes=[];
    const panels=[...document.querySelectorAll('.question')];
    current.forEach((q,i)=>{
      const panel=panels[i],input=panel.querySelector('.answer'),feedback=panel.querySelector('.feedback');
      const ok=normalize(input.value)===normalize(q.answer);
      if(ok)correct++;else mistakes.push(q);
      input.classList.add(ok?'correct':'incorrect');input.readOnly=true;
      feedback.replaceChildren();
      const marker=make('strong',ok?'pass':'fail',ok?'✓ 正確':'✗ 拼字不正確');
      feedback.append(marker);
      if(!ok){feedback.append(document.createTextNode('　正確答案：'));feedback.append(make('b','',q.answer));}
      feedback.classList.add('visible');
    });
    const pct=Math.round(correct/current.length*100);
    $('score').textContent=`${pct} / 100`;
    $('result-note').textContent=correct===current.length?'全對！再重新出題一次，測試係咪真正記熟。':`答對 ${correct} / ${current.length} 題。可以先睇正確拼字，再按「只練錯題」。`;
    $('result').classList.add('visible');
    $('retry-btn').hidden=mistakes.length===0;
    $('submit-btn').disabled=true;
    if(current.length===bank.length){const last=bestScore(),old=last===null?-1:Number(last);if(pct>old)saveBest(pct);updateBest();}
    $('result').scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  $('quiz-form').addEventListener('submit',e=>{e.preventDefault();checkAnswers();});
  $('restart-btn').addEventListener('click',()=>newQuiz(bank));
  $('retry-btn').addEventListener('click',()=>newQuiz(mistakes));
  $('hints-toggle').addEventListener('change',e=>{
    document.querySelectorAll('.question').forEach(panel=>{
      const hint=panel.querySelector('.hint'),button=panel.querySelector('.hint-btn');
      hint.classList.toggle('visible',e.target.checked);button.textContent=e.target.checked?'隱藏提示':'拆字提示';
    });
  });
  updateBest();newQuiz(bank);
})();
</script>
</body>
</html>
